[project]
name = "elton-api"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.142.2",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.11,<3",
  "uvicorn>=0.35,<1",
  "argon2-cffi>=23.1,<26",
  "Pillow>=11.0,<13",
  "elton-database",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elton_api"]

[tool.uv.sources]
elton-database = { workspace = true }
