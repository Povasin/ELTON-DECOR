name: Foundation checks

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  python-api:
    name: Python API and PostgreSQL tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: elton_test
          POSTGRES_USER: elton_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elton_test -d elton_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Synthetic CI database only.  No Ozon, payment, delivery or SMS
      # credentials are supplied to forked or pull-request jobs.
      ELTON_TEST_DATABASE_URL: postgresql+psycopg://elton_test:synthetic-ci-only@127.0.0.1:5432/elton_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.x"
          enable-cache: true
      - name: Install locked Python workspace
        run: uv sync --locked
      - name: Run API, migration and persistence tests
        run: uv run pytest -q -rs
      - name: Export active OpenAPI without runtime secrets
        run: uv run python scripts/export_openapi.py --output .ci/openapi.json

  frontend:
    name: Frontend contracts, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@9.15.4 --activate
      - name: Install locked JavaScript workspace
        run: pnpm install --frozen-lockfile
      - name: Check generated API client
        run: pnpm check:api
      - name: Typecheck workspace
        run: pnpm typecheck
      - name: Run same-origin proxy tests
        run: pnpm test:frontend
      - name: Build storefront and admin
        run: pnpm build

  browser:
    name: Optional Playwright runtime gate
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@9.15.4 --activate
      - name: Install locked JavaScript workspace
        run: pnpm install --frozen-lockfile
      - name: Run browser checks when runtime and runner are supplied
        env:
          # Opt in only from a job that provides running API/PG and the
          # explicitly approved ADM-01 environment.  Never add provider keys.
          ELTON_E2E_ENABLED: ${{ vars.ELTON_E2E_ENABLED || '0' }}
          ELTON_ADMIN_E2E_APPROVED: ${{ vars.ELTON_ADMIN_E2E_APPROVED || '0' }}
          ELTON_E2E_BASE_URL: ${{ vars.ELTON_E2E_BASE_URL || 'http://localhost:3000' }}
          ELTON_ADMIN_E2E_BASE_URL: ${{ vars.ELTON_ADMIN_E2E_BASE_URL || 'http://localhost:3001' }}
        run: |
          if [ "$ELTON_E2E_ENABLED" != "1" ]; then
            echo "Browser/API/PostgreSQL runtime gate is disabled; Playwright checks are skipped."
            exit 0
          fi
          if ! pnpm exec playwright --version >/dev/null 2>&1; then
            echo "Playwright package is not installed in the locked workspace; browser gate is skipped."
            exit 0
          fi
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test
