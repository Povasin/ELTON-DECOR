[project]
name = "elton-database"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = ["sqlalchemy>=2.0.43,<2.1", "psycopg[binary]>=3.3,<4", "alembic>=1.16,<2"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elton_database"]
